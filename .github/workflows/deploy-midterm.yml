# Publishes ONLY the midterm/ folder to GitHub Pages.
# Site: https://hammadsarwar789.github.io/WEB-DEV/
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy midterm site

on:
  push:
    branches: [main]
    paths:
      - "midterm/**"
      - ".github/workflows/deploy-midterm.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: midterm
      - id: deployment
        uses: actions/deploy-pages@v4
